version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Habilitando corepack ==="
        - corepack enable
        - echo "=== Instalando dependências ==="
        - npx --yes nypm i
        - echo "=== Dependências instaladas ==="
    build:
      commands:
        - echo "=== Iniciando build ==="
        - npm run build
        - echo "=== Build concluído ==="
        - echo "=== Verificando diretório dist ==="
        - ls -la dist/
        - echo "=== Verificando assets ==="
        - ls -la dist/assets/
        - echo "=== Processo de build finalizado ==="
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
