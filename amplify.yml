version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Instalando dependências ==="
        - npm ci --legacy-peer-deps
        - echo "=== Dependências instaladas ==="
    build:
      commands:
        - echo "=== Iniciando build ==="
        - npm run build
        - echo "=== Build concluído ==="
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
