version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - npx --yes nypm i
    build:
      commands:
        - npm run build
        - mkdir -p .amplify-hosting/static
        - cp -r dist/* .amplify-hosting/static/
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
