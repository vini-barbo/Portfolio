version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== [Portfolio] Instalando dependências ==="
        - npm ci --legacy-peer-deps
        - echo "=== [Portfolio] Dependências instaladas com sucesso ==="
        - echo "=== [Quest Lab] Verificando diretório ==="
        - ls -la applications/quest-lab-fe/
        - echo "=== [Quest Lab] Instalando dependências ==="
        - cd applications/quest-lab-fe
        - npm ci --legacy-peer-deps
        - cd ../..
        - echo "=== [Quest Lab] Dependências instaladas com sucesso ==="
    build:
      commands:
        - echo "=== [Portfolio] Build do projeto principal ==="
        - npm run build
        - echo "=== [Portfolio] Build concluído ==="
        - echo "=== [Quest Lab] Build do Next.js ==="
        - cd applications/quest-lab-fe
        - npm run build
        - cd ../..
        - echo "=== [Quest Lab] Build concluído ==="
        - echo "=== Copiando Quest Lab para dist/demo/questlab ==="
        - mkdir -p dist/demo/questlab
        - cp -r applications/quest-lab-fe/out/* dist/demo/questlab/
        - echo "=== Builds concluídos com sucesso ==="
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - applications/quest-lab-fe/node_modules/**/*
      - applications/quest-lab-fe/.next/cache/**/*
