version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - mkdir -p .amplify-hosting/static
        - cp -r dist/* .amplify-hosting/static/
        - cp .amplify-hosting/deploy-manifest.json dist/
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
