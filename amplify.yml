version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Habilitando corepack ==="
        - corepack enable
        - echo "=== Instalando dependências ==="
        - npx --yes nypm i
        - echo "=== Dependências instaladas ==="
    build:
      commands:
        - echo "=== Iniciando build ==="
        - npm run build
        - echo "=== Build concluído ==="
        - echo "=== Verificando diretório dist ==="
        - ls -la dist/
        - echo "=== Criando diretório .amplify-hosting ==="
        - mkdir -p .amplify-hosting
        - echo "=== Copiando arquivos do dist para .amplify-hosting ==="
        - cp -r dist/* .amplify-hosting/
        - echo "=== Verificando arquivos copiados ==="
        - ls -la .amplify-hosting/
        - echo "=== Processo de build finalizado ==="
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
