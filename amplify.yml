version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Instalando dependências ==="
        - npm ci --legacy-peer-deps
        - echo "=== Dependências instaladas ==="
    build:
      commands:
        - echo "=== Iniciando build ==="
        - npm run build
        - echo "=== Build concluído ==="
        - echo "=== Verificando diretório dist ==="
        - ls -la dist/
        - echo "=== Criando deploy-manifest.json ==="
        - echo '{"version":1,"framework":{"name":"react","version":"vite"}}' > dist/deploy-manifest.json
        - echo "=== Verificando arquivos ==="
        - ls -la dist/
        - cat dist/deploy-manifest.json
        - echo "=== Processo de build finalizado ==="
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
